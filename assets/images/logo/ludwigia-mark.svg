<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Monogram L Gradient -->
    <linearGradient id="markLGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="markLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="markStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Monogram L -->
  <path d="M 52 38
           C 52 26 62 16 74 16
           C 86 16 96 26 96 38
           L 96 226
           C 96 240 108 252 122 252
           L 242 252
           C 254 252 264 262 264 274
           C 264 286 254 296 242 296
           L 106 296
           C 68 296 52 268 52 230
           Z"
        fill="url(#markLGrad)"
        filter="url(#markGlow)" />

  <!-- Botanical Sprout Leaf -->
  <path d="M 104 246
           C 108 184 134 126 218 82
           C 222 80 226 84 224 88
           C 200 146 190 206 146 256
           C 132 272 112 264 104 246 Z"
        fill="url(#markLeafGrad)"
        filter="url(#markGlow)" />

  <!-- Leaf Midrib Vein -->
  <path d="M 112 242
           C 124 198 152 152 216 86"
        fill="none"
        stroke="#ecfdf5"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.65" />

  <!-- Cosmic Inspiration Star -->
  <g transform="translate(254, 56)">
    <path d="M 0 -30 C 0 -8 8 0 30 0 C 8 0 0 8 0 30 C 0 8 -8 0 -30 0 C -8 0 0 -8 0 -30 Z"
          fill="url(#markStarGrad)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>
</svg>
