<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Outer Rim Subtle Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Monogram L Gradient -->
    <linearGradient id="lGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="25%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Botanical Sprout Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="85%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Small Secondary Sprout Leaf Gradient -->
    <linearGradient id="smallLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="60%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>

    <!-- Star Glow & Flare Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Ambient Radial Glow Behind Logo -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for 3D Layering -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>

    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Background Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- 2. Ambient Internal Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)" />

  <!-- 3. Dynamic Vector Monogram "L" -->
  <path d="M 148 116
           C 148 102.7 158.7 92 172 92
           C 185.3 92 196 102.7 196 116
           L 196 324
           C 196 339.5 208.5 352 224 352
           L 348 352
           C 361.3 352 372 362.7 372 376
           C 372 389.3 361.3 400 348 400
           L 204 400
           C 162 400 148 368 148 328
           Z"
        fill="url(#lGrad)"
        filter="url(#glowShadow)" />

  <!-- Highlight Sheen on Monogram L Stem -->
  <path d="M 154 122
           L 154 324
           C 154 340 160 360 178 376
           C 166 360 162 344 162 324
           L 162 122
           C 162 118 158 118 154 122 Z"
        fill="#ffffff"
        opacity="0.35" />

  <!-- 4. Botanical Sprout: Emerging from the elbow of L upward into the light -->
  <path d="M 204 348
           C 208 280 236 216 324 168
           C 328 166 332 170 330 174
           C 304 236 294 300 248 356
           C 232 374 212 366 204 348 Z"
        fill="url(#leafGrad)"
        filter="url(#glowShadow)" />

  <!-- Leaf Central Spine / Midrib Vein Light -->
  <path d="M 212 344
           C 226 296 254 246 322 172"
        fill="none"
        stroke="#ecfdf5"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.6" />

  <!-- Secondary Petite Leaf Bud -->
  <path d="M 216 312
           C 220 270 244 244 278 232
           C 281 231 282 235 280 238
           C 264 266 252 292 234 318
           C 228 326 218 322 216 312 Z"
        fill="url(#smallLeafGrad)"
        opacity="0.9" />

  <!-- 5. Cosmic Inspiration Spark: 4-Point Brilliant Star at Apex -->
  <g transform="translate(366, 140)" filter="url(#starGlow)">
    <path d="M 0 -36 C 0 -10 10 0 36 0 C 10 0 0 10 0 36 C 0 10 -10 0 -36 0 C -10 0 0 -10 0 -36 Z"
          fill="url(#starGrad)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <circle cx="0" cy="0" r="14" fill="#fef08a" opacity="0.3" />
  </g>

  <!-- Micro Constellation Particles -->
  <circle cx="396" cy="216" r="3" fill="#a7f3d0" opacity="0.75" />
  <circle cx="160" cy="220" r="2.5" fill="#c7d2fe" opacity="0.5" />
  <circle cx="320" cy="280" r="2.5" fill="#67e8f9" opacity="0.6" />
</svg>
