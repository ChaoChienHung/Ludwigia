<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="傳送門 · Ludwigia" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="../assets/images/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" href="../assets/images/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Theme & palette preload (same contract as the main site / World): apply the saved
         theme + palette classes and load the shared palette tokens, so the Portals accent
         (--ap-accent) is projected from the site-wide palette instead of a second colour set.
         Injected at runtime so Vite leaves the shared stylesheet as a live link. -->
    <script>
      (function () {
        var root = document.documentElement;
        var themes = ['light-theme', 'deep-sea-theme', 'galaxy-theme', 'sky-theme', 'garden-theme'];
        function apply() {
          try {
            root.classList.remove.apply(root.classList, themes);
            var theme = String(localStorage.getItem('theme') || '').trim().toLowerCase();
            var selected = theme === 'deep-sea' || theme === 'galaxy-night' ? 'deep-sea-theme' : theme + '-theme';
            if (themes.indexOf(selected) >= 0) root.classList.add(selected);
            Array.prototype.slice.call(root.classList).forEach(function (n) {
              if (n.indexOf('palette-') === 0) root.classList.remove(n);
            });
            var palette = String(localStorage.getItem('site_palette_v1') || '').trim().toLowerCase();
            if (/^[a-z0-9-]+$/.test(palette)) root.classList.add('palette-' + palette);
            var lang = String(localStorage.getItem('site_lang_v1') || '').trim();
            if (lang) root.setAttribute('lang', lang);
          } catch (e) { /* storage unavailable */ }
        }
        apply();
        window.addEventListener('storage', function (e) {
          if (!e.key || e.key === 'theme' || e.key === 'site_palette_v1') apply();
        });
        var link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = '../assets/css/site/palette-tokens.css';
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
